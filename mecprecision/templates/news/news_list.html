<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Tin tức - MecPrecision Django</title>
</head>
<body>
  <main>
    <h1>Tin tức</h1>

    <form method="get">
      <input name="q" value="{{ q }}" placeholder="Tìm theo tiêu đề, danh mục, tag">
      <select name="category_id">
        <option value="">Tất cả danh mục</option>
        {% for category in categories %}
          <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
      </select>
      <button type="submit">Tìm</button>
    </form>

    <section>
      {% for article in page_obj %}
        <article>
          <img src="{{ article.thumbnail_url|default:article.image }}" alt="{{ article.title }}" width="240">
          <p>{{ article.category.name }} - {{ article.published_at }}</p>
          <h2><a href="{% url 'news:detail' article.id %}">{{ article.title }}</a></h2>
          <p>{{ article.description }}</p>
        </article>
      {% empty %}
        <p>Chưa có tin tức phù hợp.</p>
      {% endfor %}
    </section>
  </main>
</body>
</html>
