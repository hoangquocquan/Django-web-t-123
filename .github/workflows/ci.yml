name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: django_backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Run full Django test suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python -m pytest -q

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma_make_frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: figma_make_frontend/pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
