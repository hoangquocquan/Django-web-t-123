name: AWS Learning Lab CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:

jobs:
  aws-lab-simulation:
    name: Validate local AWS learning lab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django_backend/requirements.txt -r backend/requirements.txt

      - name: Run learning lab tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest tests/test_aws_learning_lab.py

      - name: Validate Docker Compose syntax
        run: docker compose -f docker/aws-lab/docker-compose.aws-lab.yml config

      - name: Build Django lab image
        run: docker compose -f docker/aws-lab/docker-compose.aws-lab.yml build django
