name: django-web-t-123-phase6

services:
  postgres:
    image: postgres:16-alpine
    container_name: django-web-t-123-phase6-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${PHASE6_POSTGRES_DB:?PHASE6_POSTGRES_DB is required}
      POSTGRES_USER: ${PHASE6_POSTGRES_USER:?PHASE6_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${PHASE6_POSTGRES_PASSWORD:?PHASE6_POSTGRES_PASSWORD is required}
    command: ["postgres", "-c", "statement_timeout=30000", "-c", "lock_timeout=10000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [phase6-internal]
    volumes:
      - phase6-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: django-web-t-123-phase6-redis
    restart: "no"
    environment:
      REDIS_PASSWORD: ${PHASE6_REDIS_PASSWORD:?PHASE6_REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [phase6-internal]

  django:
    build:
      context: .
      dockerfile: Dockerfile
    image: django-web-t-123-phase6-django:local
    container_name: django-web-t-123-phase6-django
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:${PHASE6_DJANGO_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${PHASE6_SECRET_KEY:?PHASE6_SECRET_KEY is required}
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: ""
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:${PHASE6_VITE_PORT:-8443}
      DATABASE_URL: postgresql://${PHASE6_POSTGRES_USER:?required}:${PHASE6_POSTGRES_PASSWORD:?required}@postgres:5432/${PHASE6_POSTGRES_DB:?required}
      DATABASE_SSLMODE: disable
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      REDIS_URL: redis://:${PHASE6_REDIS_PASSWORD:?required}@redis:6379/0?socket_connect_timeout=5&socket_timeout=5
      METRICS_BEARER_TOKEN: ${PHASE6_METRICS_BEARER_TOKEN:?PHASE6_METRICS_BEARER_TOKEN is required}
      SECURE_SSL_REDIRECT: "false"
      CACHE_KEY_PREFIX: phase6
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/phase6/ready/', timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 20
    networks: [phase6-internal]
    volumes:
      - phase6-media:/app/django_backend/media

  frontend:
    profiles: [phase6d]
    build:
      context: .
      dockerfile: Dockerfile.phase6-frontend
    image: django-web-t-123-phase6-frontend:local
    container_name: django-web-t-123-phase6-frontend
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports:
      - "127.0.0.1:${PHASE6_VITE_PORT:-8443}:8080"
    depends_on:
      django: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/phase6/ready/"]
      interval: 3s
      timeout: 4s
      retries: 20
    networks: [phase6-internal]
    volumes:
      - phase6-media:/srv/media:ro

networks:
  phase6-internal:
    name: django-web-t-123-phase6-internal
    driver: bridge

volumes:
  phase6-postgres-data:
    name: django-web-t-123-phase6-postgres-data
  phase6-media:
    name: django-web-t-123-phase6-media
