services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mecprecision-vietnam:local
    container_name: mecprecision-web-local
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: docker-local-build-only-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      DATABASE_URL: sqlite:////app/django_backend/db.sqlite3
      LEGACY_DATABASE_URL: file:/app/backend/database/mecprecision.sqlite?mode=ro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mecprecision-local
    volumes:
      - media-data:/app/django_backend/media

  database:
    image: postgres:16-alpine
    container_name: mecprecision-postgres-local
    environment:
      POSTGRES_DB: mecprecision_local
      POSTGRES_USER: mecprecision
      POSTGRES_PASSWORD: local-dev-password-only
    networks:
      - mecprecision-local
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mecprecision-redis-local
    networks:
      - mecprecision-local
    volumes:
      - redis-data:/data

networks:
  mecprecision-local:
    driver: bridge

volumes:
  media-data:
  postgres-data:
  redis-data:
