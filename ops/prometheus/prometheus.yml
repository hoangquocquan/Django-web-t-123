global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/prod05-alerts.yml

scrape_configs:
  - job_name: mecprecision-django
    metrics_path: /api/v1/metrics/
    scheme: https
    bearer_token_file: /run/secrets/mecprecision_metrics_token
    static_configs:
      - targets:
          - mecprecision.example.com
        labels:
          environment: production
